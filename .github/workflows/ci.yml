name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Latest phase proof is reproducible (no diff after regenerating)
        run: |
          d=$(ls -d docs/proof/phase-* | sort | tail -1); node scripts/proof.js "$(basename "$d")"
          git diff --exit-code -- "$d" ":(exclude)$d/SUMMARY.md"
