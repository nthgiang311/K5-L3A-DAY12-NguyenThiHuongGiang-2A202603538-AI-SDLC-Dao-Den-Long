name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Proof is reproducible (no diff after regenerating)
        run: |
          for d in docs/proof/phase-*; do node scripts/proof.js "$(basename "$d")"; done
          git diff --exit-code -- docs/proof ':(exclude)docs/proof/*/SUMMARY.md'
